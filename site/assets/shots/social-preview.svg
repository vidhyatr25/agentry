<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#161b24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="60%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <g transform="translate(70, 80)">
    <rect width="64" height="64" rx="18" fill="url(#brand)"/>
    <text x="32" y="46" text-anchor="middle" fill="#fff" font-size="34" font-weight="700">◆</text>
    <text x="84" y="50" fill="#e8edf4" font-size="40" font-weight="700" letter-spacing="-0.5">Agentry</text>
  </g>

  <text x="70" y="220" fill="#e8edf4" font-size="60" font-weight="800" letter-spacing="-1.5">
    Agentic workflow engine
  </text>
  <text x="70" y="290" fill="#e8edf4" font-size="60" font-weight="800" letter-spacing="-1.5">
    that ships content on
  </text>
  <text x="70" y="360" font-size="60" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#brand)">autopilot — for free.</tspan>
  </text>

  <text x="70" y="425" fill="#8b97a8" font-size="22">
    Config-driven · n8n-style visual builder · self-hosted on GitHub Actions + Pages
  </text>

  <g font-size="18" fill="#e8edf4">
    <g transform="translate(70, 480)">
      <rect width="200" height="48" rx="24" fill="#161b24" stroke="#232a36"/>
      <text x="100" y="30" text-anchor="middle">🧠 Agentic planner</text>
    </g>
    <g transform="translate(290, 480)">
      <rect width="200" height="48" rx="24" fill="#161b24" stroke="#232a36"/>
      <text x="100" y="30" text-anchor="middle">⬡ Visual builder</text>
    </g>
    <g transform="translate(510, 480)">
      <rect width="220" height="48" rx="24" fill="#161b24" stroke="#232a36"/>
      <text x="110" y="30" text-anchor="middle">🎬 Video / audio native</text>
    </g>
    <g transform="translate(750, 480)">
      <rect width="200" height="48" rx="24" fill="#161b24" stroke="#232a36"/>
      <text x="100" y="30" text-anchor="middle">💸 Cost-aware</text>
    </g>
    <g transform="translate(970, 480)">
      <rect width="240" height="48" rx="24" fill="#161b24" stroke="#232a36"/>
      <text x="120" y="30" text-anchor="middle">🛡 Safety + budget guard</text>
    </g>
  </g>

  <text x="70" y="592" fill="#46506a" font-size="16">github.com/vidhyatr25/agentry</text>
  <text x="1210" y="592" text-anchor="end" fill="#46506a" font-size="16">MIT · Python 3.12+</text>
</svg>
