<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0c10"/><stop offset="1" stop-color="#11151c"/></linearGradient>
    <linearGradient id="brand2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg2)"/>
  <rect x="0" y="0" width="248" height="720" fill="#11151c" stroke="#232a36"/>
  <rect x="20" y="24" width="30" height="30" rx="9" fill="url(#brand2)"/>
  <text x="58" y="44" fill="#e8edf4" font-size="15" font-weight="700">Workflow Studio</text>
  <g font-size="13" fill="#8b97a8">
    <text x="32" y="103">▤ Dashboard</text>
    <rect x="14" y="120" width="220" height="38" rx="10" fill="#161b24"/>
    <text x="32" y="143" fill="#e8edf4">✦ Workflow Studio</text>
    <text x="32" y="183">⬡ Visual Builder</text>
    <text x="32" y="223">⏱ Schedules</text>
    <text x="32" y="263">✎ Prompts</text>
  </g>
  <!-- header -->
  <text x="282" y="56" fill="#e8edf4" font-size="22" font-weight="700">Workflow Studio</text>
  <text x="282" y="78" fill="#8b97a8" font-size="13">Edit any workflow, prompt, provider and schedule — no code</text>
  <rect x="940" y="38" width="160" height="34" rx="9" fill="#0b0f15" stroke="#232a36"/>
  <text x="956" y="60" fill="#e8edf4" font-size="13">kids_video_youtube ▾</text>
  <rect x="1110" y="38" width="60" height="34" rx="9" fill="#161b24" stroke="#232a36"/>
  <text x="1129" y="60" fill="#e8edf4" font-size="13">Open</text>
  <!-- big card -->
  <rect x="282" y="100" width="888" height="586" rx="14" fill="#11151c" stroke="#232a36"/>
  <text x="306" y="132" fill="#e8edf4" font-size="14" font-weight="700">kids_video_youtube</text>
  <text x="494" y="132" fill="#8b97a8" font-size="12">Daily AI Shorts → YouTube</text>
  <!-- Providers section -->
  <text x="306" y="170" fill="#8b97a8" font-size="11" font-weight="700">PROVIDERS</text>
  <rect x="306" y="184" width="416" height="80" rx="10" fill="#161b24" stroke="#232a36"/>
  <text x="320" y="206" fill="#e8edf4" font-size="13" font-weight="600">llm_default <tspan fill="#8b97a8" font-size="11">(llm)</tspan></text>
  <text x="320" y="226" fill="#8b97a8" font-size="11">PROVIDER</text>
  <rect x="320" y="232" width="180" height="26" rx="6" fill="#0b0f15" stroke="#232a36"/>
  <text x="334" y="250" fill="#e8edf4" font-size="12">gemini ▾</text>
  <text x="514" y="226" fill="#8b97a8" font-size="11">MODEL</text>
  <rect x="514" y="232" width="190" height="26" rx="6" fill="#0b0f15" stroke="#232a36"/>
  <text x="528" y="250" fill="#e8edf4" font-size="12">gemini-2.0-flash</text>

  <rect x="734" y="184" width="416" height="80" rx="10" fill="#161b24" stroke="#232a36"/>
  <text x="748" y="206" fill="#e8edf4" font-size="13" font-weight="600">publisher_default <tspan fill="#8b97a8" font-size="11">(publisher)</tspan></text>
  <rect x="748" y="232" width="180" height="26" rx="6" fill="#0b0f15" stroke="#232a36"/>
  <text x="762" y="250" fill="#e8edf4" font-size="12">youtube ▾</text>

  <!-- Steps & prompts -->
  <text x="306" y="298" fill="#8b97a8" font-size="11" font-weight="700">STEPS &amp; PROMPTS</text>
  <rect x="306" y="312" width="844" height="92" rx="10" fill="#161b24" stroke="#232a36"/>
  <text x="320" y="334" fill="#e8edf4" font-size="13" font-weight="600">3. write_script</text>
  <text x="320" y="354" fill="#8b97a8" font-size="11">PROMPT</text>
  <rect x="320" y="360" width="816" height="36" rx="6" fill="#0b0f15" stroke="#232a36"/>
  <text x="332" y="378" fill="#e8edf4" font-size="12" font-family="ui-monospace,Menlo">Write a narrated short video script for children.</text>
  <text x="332" y="394" fill="#e8edf4" font-size="12" font-family="ui-monospace,Menlo">Title: {{ subject.title }}  Tone: {{ subject.tone }} …</text>

  <rect x="306" y="416" width="844" height="92" rx="10" fill="#161b24" stroke="#232a36"/>
  <text x="320" y="438" fill="#e8edf4" font-size="13" font-weight="600">8. optimize_metadata</text>
  <text x="320" y="458" fill="#8b97a8" font-size="11">PROMPT</text>
  <rect x="320" y="464" width="816" height="36" rx="6" fill="#0b0f15" stroke="#232a36"/>
  <text x="332" y="482" fill="#e8edf4" font-size="12" font-family="ui-monospace,Menlo">Create youtube_shorts SEO metadata; primary keyword in first 40 chars …</text>

  <!-- buttons -->
  <rect x="306" y="540" width="92" height="34" rx="9" fill="#161b24" stroke="#232a36"/>
  <text x="328" y="562" fill="#e8edf4" font-size="13">Validate</text>
  <rect x="408" y="540" width="148" height="34" rx="9" fill="url(#brand2)"/>
  <text x="430" y="562" fill="#fff" font-size="13" font-weight="600">Download JSON</text>
  <rect x="566" y="540" width="92" height="34" rx="9" fill="#161b24" stroke="#232a36"/>
  <text x="588" y="562" fill="#e8edf4" font-size="13">Copy</text>
  <rect x="668" y="540" width="160" height="34" rx="9" fill="#161b24" stroke="#232a36"/>
  <text x="688" y="562" fill="#e8edf4" font-size="13">Save to GitHub</text>
</svg>
