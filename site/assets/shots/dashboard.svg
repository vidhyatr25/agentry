<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/><stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="248" height="720" fill="#11151c" stroke="#232a36"/>
  <rect x="20" y="24" width="30" height="30" rx="9" fill="url(#brand)"/>
  <text x="58" y="44" fill="#e8edf4" font-size="15" font-weight="700">Workflow Studio</text>
  <g font-size="13" fill="#8b97a8">
    <rect x="14" y="80" width="220" height="38" rx="10" fill="#161b24"/>
    <text x="32" y="103" fill="#e8edf4">▤ Dashboard</text>
    <text x="32" y="143">✦ Workflow Studio</text>
    <text x="32" y="183">⬡ Visual Builder</text>
    <text x="32" y="223">⏱ Schedules</text>
  </g>
  <!-- header -->
  <text x="282" y="56" fill="#e8edf4" font-size="22" font-weight="700">Dashboard</text>
  <text x="282" y="78" fill="#8b97a8" font-size="13">Live production metrics from the automation engine</text>
  <rect x="1060" y="38" width="100" height="32" rx="9" fill="#161b24" stroke="#232a36"/>
  <text x="1083" y="59" fill="#e8edf4" font-size="13">↻ Refresh</text>
  <!-- KPIs -->
  <g font-family="-apple-system">
    <rect x="282" y="110" width="200" height="100" rx="14" fill="#11151c" stroke="#232a36"/>
    <text x="298" y="160" fill="#e8edf4" font-size="32" font-weight="700">128</text>
    <text x="298" y="183" fill="#8b97a8" font-size="11">VIDEOS PUBLISHED</text>
    <text x="298" y="200" fill="#5b8cff" font-size="12">lifetime</text>

    <rect x="496" y="110" width="200" height="100" rx="14" fill="#11151c" stroke="#232a36"/>
    <text x="512" y="160" fill="#e8edf4" font-size="32" font-weight="700">372</text>
    <text x="512" y="183" fill="#8b97a8" font-size="11">TOTAL RUNS</text>

    <rect x="710" y="110" width="200" height="100" rx="14" fill="#11151c" stroke="#232a36"/>
    <text x="726" y="160" fill="#e8edf4" font-size="32" font-weight="700">1.84M</text>
    <text x="726" y="183" fill="#8b97a8" font-size="11">TOKENS USED</text>

    <rect x="924" y="110" width="240" height="100" rx="14" fill="#11151c" stroke="#232a36"/>
    <text x="940" y="160" fill="#e8edf4" font-size="32" font-weight="700">$0.4123</text>
    <text x="940" y="183" fill="#8b97a8" font-size="11">TOTAL COST</text>
  </g>
  <!-- chart card -->
  <text x="282" y="240" fill="#8b97a8" font-size="12" font-weight="700">TOKENS — RECENT RUNS</text>
  <rect x="282" y="252" width="882" height="150" rx="14" fill="#11151c" stroke="#232a36"/>
  <g>
    <rect x="306" y="380" width="36" height="-72" transform="translate(0,72)" fill="url(#brand)" rx="4"/>
    <rect x="356" y="380" width="36" height="-100" transform="translate(0,100)" fill="url(#brand)" rx="4"/>
    <rect x="406" y="380" width="36" height="-55" transform="translate(0,55)" fill="url(#brand)" rx="4"/>
    <rect x="456" y="380" width="36" height="-90" transform="translate(0,90)" fill="url(#brand)" rx="4"/>
    <rect x="506" y="380" width="36" height="-110" transform="translate(0,110)" fill="url(#brand)" rx="4"/>
    <rect x="556" y="380" width="36" height="-65" transform="translate(0,65)" fill="url(#brand)" rx="4"/>
    <rect x="606" y="380" width="36" height="-95" transform="translate(0,95)" fill="url(#brand)" rx="4"/>
    <rect x="656" y="380" width="36" height="-120" transform="translate(0,120)" fill="url(#brand)" rx="4"/>
    <rect x="706" y="380" width="36" height="-85" transform="translate(0,85)" fill="url(#brand)" rx="4"/>
    <rect x="756" y="380" width="36" height="-105" transform="translate(0,105)" fill="url(#brand)" rx="4"/>
    <rect x="806" y="380" width="36" height="-115" transform="translate(0,115)" fill="url(#brand)" rx="4"/>
    <rect x="856" y="380" width="36" height="-95" transform="translate(0,95)" fill="url(#brand)" rx="4"/>
  </g>
  <!-- recent table -->
  <text x="282" y="438" fill="#8b97a8" font-size="12" font-weight="700">RECENTLY PUBLISHED</text>
  <rect x="282" y="450" width="882" height="240" rx="14" fill="#11151c" stroke="#232a36"/>
  <g font-size="13" fill="#e8edf4">
    <text x="306" y="478" fill="#8b97a8" font-size="11" font-weight="700">TITLE</text>
    <text x="600" y="478" fill="#8b97a8" font-size="11" font-weight="700">PLATFORM</text>
    <text x="760" y="478" fill="#8b97a8" font-size="11" font-weight="700">STATUS</text>
    <text x="880" y="478" fill="#8b97a8" font-size="11" font-weight="700">WHEN</text>
    <line x1="296" y1="490" x2="1150" y2="490" stroke="#232a36"/>
    <text x="306" y="515">Why the Sky Changes Colors 🌱</text>
    <text x="600" y="515">youtube</text>
    <rect x="754" y="500" width="76" height="20" rx="10" fill="#0f1f15" stroke="#1f3d28"/>
    <text x="768" y="515" fill="#3fb950" font-size="11">published</text>
    <text x="880" y="515">12:01 PM</text>

    <text x="306" y="555">A Tiny Seed's Big Adventure</text>
    <text x="600" y="555">youtube</text>
    <rect x="754" y="540" width="76" height="20" rx="10" fill="#0f1f15" stroke="#1f3d28"/>
    <text x="768" y="555" fill="#3fb950" font-size="11">published</text>
    <text x="880" y="555">06:01 AM</text>

    <text x="306" y="595">Bees Make Magic Honey</text>
    <text x="600" y="595">youtube</text>
    <rect x="754" y="580" width="76" height="20" rx="10" fill="#0f1f15" stroke="#1f3d28"/>
    <text x="768" y="595" fill="#3fb950" font-size="11">published</text>
    <text x="880" y="595">Yesterday</text>
  </g>
</svg>
