<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Studio · Visual Builder</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .canvaswrap { position: relative; height: calc(100vh - 150px); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; background:
    radial-gradient(circle, #1a2130 1px, transparent 1px) 0 0/26px 26px, var(--panel); }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { cursor: grab; }
  .node rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.5; rx: 12; }
  .node.sel rect { stroke: var(--brand); stroke-width: 2.5; }
  .node text { fill: var(--txt); font: 600 13px ui-sans-serif, sans-serif; }
  .node .sub { fill: var(--muted); font: 11px ui-monospace, monospace; }
  .edge { stroke: #46506a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .inspector { position: absolute; top: 0; right: 0; width: 340px; height: 100%;
    background: var(--panel); border-left: 1px solid var(--line); padding: 18px;
    overflow: auto; transform: translateX(360px); transition: transform .18s; }
  .inspector.open { transform: none; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="dot">◆</span> Workflow Studio</div>
    <nav>
      <a href="index.html">▤ Dashboard</a>
      <a href="studio.html">✦ Workflow Studio</a>
      <a class="active" href="graph.html">⬡ Visual Builder</a>
      <a href="start.html">▶ Get Started</a>
      <a href="studio.html#schedules">⏱ Schedules</a>
    </nav>
    <div class="foot">n8n-style DAG editor · saves graph JSON the engine runs natively</div>
  </aside>
  <main>
    <div class="head">
      <div><h1>Visual Builder</h1><p>Drag nodes, wire dependencies, branch with conditions — exports a graph workflow</p></div>
    </div>
    <div class="toolbar">
      <select class="in" id="wf" style="width:auto"></select>
      <button class="btn" id="load">Open</button>
      <select class="in" id="palette" style="width:auto"></select>
      <button class="btn" id="add">+ Add node</button>
      <button class="btn" id="connect">⤳ Connect mode: off</button>
      <button class="btn" id="del">🗑 Delete selected</button>
      <button class="btn primary" id="save">Save graph to GitHub</button>
      <span id="msg" class="muted"></span>
    </div>
    <div class="canvaswrap">
      <svg id="cv">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="#46506a"/></marker></defs>
        <g id="edges"></g><g id="nodes"></g>
      </svg>
      <div class="inspector" id="insp">
        <strong>Node</strong>
        <label class="fld">ID</label><input class="in" id="i_id">
        <label class="fld">Type</label><input class="in" id="i_type">
        <label class="fld">Needs (comma ids)</label><input class="in" id="i_needs">
        <label class="fld">When (optional, e.g. {{ safety.safe }})</label><input class="in" id="i_when">
        <label class="fld">Params (JSON)</label><textarea class="in" id="i_params" style="height:230px"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="apply">Apply</button>
          <button class="btn" id="close">Close</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <span class="muted">GitHub (to save):</span>
      <div class="row" style="margin-top:8px">
        <input class="in" id="repo" placeholder="owner/repo" style="max-width:240px">
        <input class="in" id="pat" type="password" placeholder="github_pat_…" style="max-width:300px">
      </div>
    </div>
  </main>
</div>
<script>
const j = async p => (await fetch(p+'?t='+Date.now())).json();
const $ = id => document.getElementById(id);
let G = { name:'', obj:null, file:null }, NODES = [], sel = null, connectMode = false, connectFrom = null;

async function boot() {
  const idx = await j('data/workflows/index.json').catch(()=>[]);
  $('wf').innerHTML = idx.map(w=>`<option value="${w.file}">${w.name}</option>`).join('');
  let steps = [], tools = [];
  try { steps = Object.entries(await j('data/providers.json')).find(([k])=>k==='step')?.[1]||[]; } catch(e){}
  try { tools = (await j('data/tools.json')).map(t=>t.name); } catch(e){}
  $('palette').innerHTML = [...steps.map(s=>`step:${s}`), ...tools.map(t=>`tool:${t}`)]
    .map(x=>`<option>${x}</option>`).join('');
  if (idx.length) loadWf(idx[0].file);
}
async function loadWf(file) {
  const o = await j('data/workflows/'+file);
  G = { name:o.name, obj:o, file:'workflows/'+file };
  NODES = (o.nodes || (o.steps||[]).map((s,i)=>({
    id: s.id || `${s.type}_${i}`, type: s.type, params: s.params||{},
    needs: i? [ (o.steps[i-1].id || `${o.steps[i-1].type}_${i-1}`) ] : []
  }))).map((n,i)=>({ ...n, x: 60+(i%4)*250, y: 40+Math.floor(i/4)*140 }));
  draw(); $('msg').textContent = 'Loaded '+file;
}
function draw() {
  const N = $('nodes'), E = $('edges'); N.innerHTML=''; E.innerHTML='';
  const pos = {}; NODES.forEach(n=>pos[n.id]=n);
  NODES.forEach(n => (n.needs||[]).forEach(dep => {
    const a = pos[dep], b = n; if(!a) return;
    const x1=a.x+190, y1=a.y+34, x2=b.x, y2=b.y+34;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','edge');
    p.setAttribute('d',`M${x1} ${y1} C ${x1+60} ${y1}, ${x2-60} ${y2}, ${x2} ${y2}`);
    E.appendChild(p);
  }));
  NODES.forEach(n => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node'+(sel===n.id?' sel':'')); g.setAttribute('transform',`translate(${n.x},${n.y})`);
    g.innerHTML = `<rect width="190" height="68" rx="12"></rect>
      <text x="14" y="28">${n.id}</text>
      <text class="sub" x="14" y="48">${n.type}${n.when?' ⌁':''}</text>`;
    g.addEventListener('mousedown', e => startDrag(e, n));
    g.addEventListener('click', e => { e.stopPropagation(); pick(n); });
    N.appendChild(g);
  });
}
let drag = null;
function startDrag(e, n) {
  if (connectMode) { if(!connectFrom){connectFrom=n;} else { if(connectFrom.id!==n.id){ n.needs=[...new Set([...(n.needs||[]),connectFrom.id])]; } connectFrom=null; draw(); } return; }
  drag = { n, ox: e.clientX - n.x, oy: e.clientY - n.y };
}
window.addEventListener('mousemove', e => { if(drag){ drag.n.x=e.clientX-drag.ox; drag.n.y=e.clientY-drag.oy; draw(); }});
window.addEventListener('mouseup', () => drag=null);
function pick(n) {
  sel = n.id; draw();
  $('i_id').value=n.id; $('i_type').value=n.type;
  $('i_needs').value=(n.needs||[]).join(','); $('i_when').value=n.when||'';
  $('i_params').value=JSON.stringify(n.params||{}, null, 2);
  $('insp').classList.add('open');
}
$('apply').onclick = () => {
  const n = NODES.find(x=>x.id===sel); if(!n) return;
  let p; try{ p=JSON.parse($('i_params').value); }catch(e){ return $('msg').textContent='Bad params JSON'; }
  const oldId=n.id, nid=$('i_id').value.trim();
  n.type=$('i_type').value.trim(); n.params=p;
  n.needs=$('i_needs').value.split(',').map(s=>s.trim()).filter(Boolean);
  n.when=$('i_when').value.trim()||undefined;
  if(nid && nid!==oldId){ n.id=nid; NODES.forEach(x=>x.needs=(x.needs||[]).map(d=>d===oldId?nid:d)); }
  sel=n.id; draw(); $('msg').textContent='Applied';
};
$('close').onclick = () => $('insp').classList.remove('open');
$('add').onclick = () => {
  const [k,v] = $('palette').value.split(':');
  const id = v+'_'+Math.random().toString(36).slice(2,5);
  NODES.push({ id, type: k==='tool'?'agent':v, params: k==='tool'?{tool:v}:{}, needs:[], x:80, y:80 });
  draw();
};
$('connect').onclick = () => { connectMode=!connectMode; connectFrom=null;
  $('connect').textContent='⤳ Connect mode: '+(connectMode?'ON (click source then target)':'off'); };
$('del').onclick = () => { if(!sel) return; NODES=NODES.filter(n=>n.id!==sel);
  NODES.forEach(n=>n.needs=(n.needs||[]).filter(d=>d!==sel)); sel=null; $('insp').classList.remove('open'); draw(); };
$('load').onclick = () => loadWf($('wf').value);
$('cv').addEventListener('click', ()=>{ sel=null; $('insp').classList.remove('open'); draw(); });

function graphJSON() {
  const o = JSON.parse(JSON.stringify(G.obj));
  delete o.steps;
  o.nodes = NODES.map(({x,y,...keep}) => keep);
  return JSON.stringify(o, null, 2);
}
$('save').onclick = async () => {
  const repo=$('repo').value.trim(), pat=$('pat').value.trim();
  if(!repo||!pat){ $('msg').textContent='Enter repo + token'; return; }
  const api=`https://api.github.com/repos/${repo}/contents/${G.file}`;
  const h={'Authorization':'Bearer '+pat,'Accept':'application/vnd.github+json'};
  let sha=null; try{ const g=await fetch(api,{headers:h}); if(g.ok) sha=(await g.json()).sha; }catch(e){}
  const body={message:`graph: update ${G.file} via visual builder`,
    content: btoa(unescape(encodeURIComponent(graphJSON())))}; if(sha) body.sha=sha;
  const r=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify(body)});
  $('msg').textContent = r.ok ? 'Saved ✓ engine runs it as a graph next run' : 'Save failed '+r.status;
};
boot();
</script>
</body>
</html>
